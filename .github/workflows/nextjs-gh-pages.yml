name: Redirect GitHub Pages to Firebase

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  TARGET: https://caique-coelho.web.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect pages
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Caíque Coelho — Senior SDET</title>
          <link rel="canonical" href="${TARGET}/">
          <meta name="robots" content="noindex, follow">
          <meta http-equiv="refresh" content="0; url=${TARGET}/">
          <script>
            var path = location.pathname.replace(/^\/my-portfolio\/?/, "");
            location.replace("${TARGET}/" + path + location.search + location.hash);
          </script>
          </head>
          <body><a href="${TARGET}/">caique-coelho.web.app</a></body>
          </html>
          EOF
          cp redirect/index.html redirect/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
